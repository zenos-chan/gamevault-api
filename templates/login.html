{% extends 'base.html' %}

{% block title %}Sign In | GameVault API Developer Portal{% endblock %}

{% block content %}
<section class="min-h-[75vh] flex items-center justify-center py-16 px-4">
    <div class="max-w-md w-full relative z-10">
        <!-- Ambient Glow -->
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-72 h-72 bg-brand-500/15 rounded-full blur-[90px] pointer-events-none"></div>

        <div class="glass-panel p-8 sm:p-10 rounded-2xl border border-slate-800 shadow-2xl relative">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-brand-400 mx-auto mb-3 shadow-lg">
                    <i class="ph-bold ph-sign-in text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Developer Sign In</h1>
                <p class="text-xs text-slate-400 mt-1">Access your API access token, usage metrics, and sandbox.</p>
            </div>

            <form method="POST" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase font-mono tracking-wider">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <i class="ph-bold ph-user"></i>
                        </span>
                        <input type="text" name="username" required value="{{ username|default:'' }}" placeholder="Enter your username" class="w-full bg-slate-900/90 text-white text-sm pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/80 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-medium text-slate-300 uppercase font-mono tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <i class="ph-bold ph-lock"></i>
                        </span>
                        <input type="password" name="password" required placeholder="Enter your password" class="w-full bg-slate-900/90 text-white text-sm pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/80 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-600 via-accent-purple to-accent-purple hover:from-brand-500 hover:to-accent-purple font-semibold text-white shadow-xl shadow-brand-500/25 transition duration-200 flex items-center justify-center gap-2 text-sm">
                        <span>Sign In to Dashboard</span>
                        <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
                Don't have an API key yet?
                <a href="{% url 'signup' %}" class="font-semibold text-brand-400 hover:text-brand-300 ml-1 transition">Register for free</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
