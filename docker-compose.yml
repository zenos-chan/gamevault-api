version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gamevault_mysql
    restart: always
    environment:
      MYSQL_DATABASE: gamevault_db
      MYSQL_USER: gamevault_user
      MYSQL_PASSWORD: secure_db_password_123
      MYSQL_ROOT_PASSWORD: root_master_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: gamevault_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=mysql
      - DB_NAME=gamevault_db
      - DB_USER=gamevault_user
      - DB_PASSWORD=secure_db_password_123
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
